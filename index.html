<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Model</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="open-sans">
    <div id="box">
        <div class="box-img">
            <img src="image/jessica.jpeg" alt="">
        </div>
        <div class="box-content">
            <h1>Jessica Randall</h1>
            <p class="first-p">London,United kingdom</p>
            <p>"Front-end developer and avid reader."</p>
        </div>
        <div class="box-btn">
            <button><a href="https://github.com/" target="_blank">Github</a></button><br>
            <button><a href="https://www.frontendmentor.io/" target="_blank">Frontend Mentor</a></button><br>
            <button><a href="https://en.wikipedia.org/wiki/LinkedIn" target="_blank">Linkedin</a></button><br>
            <button><a href="https://en.wikipedia.org/wiki/Twitter" target="_blank">Twitter</a></button><br>
            <button><a href="https://en.wikipedia.org/wiki/Instagram" target="_blank">Instagram</a></button><br>
        </div>
    </div>
</body>

</html>
